spring.application.name=speechmatrix
# Server 
server.port=8080

# Database (PostgreSQL) 
spring.datasource.url=jdbc:postgresql://localhost:5432/DBSpeechMatrix
spring.datasource.username=postgres
spring.datasource.password=P@ssword
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP â?? Spring Boot default)
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

#  JPA / Hibernate 
# update = create/alter tables automatically; use 'validate' in production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.open-in-view=false

# File Upload 
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=uploads

# JWT
app.jwt.secret=VoxScriptSuperSecretKey2024ReplaceInProduction!!
app.jwt.expiration-ms=86400000

# STT Provider 
app.stt.provider=deepgram
app.stt.deepgram.api-key=REPLACE_WITH_YOUR_KEY
app.stt.deepgram.base-url=https://api.deepgram.com/v1

app.stt.provider=google
app.stt.google.credentials-path=src/main/resources/google-credentials.json

app.stt.provider=assemblyai
app.stt.assemblyai.api-key=REPLACE_WITH_YOUR_KEY
app.stt.assemblyai.base-url=https://api.assemblyai.com/v2

# Logging
logging.level.com.sttapp=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
